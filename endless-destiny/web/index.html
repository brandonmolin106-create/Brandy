<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endless Destiny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&family=Marcellus+SC&display=swap">
<style>
  :root {
    color-scheme: dark;
    --void: #04050a;
    --indigo: #121633;
    --midnight: #0a1030;
    --violet: #9a93cf;
    --mist: #d6d7ee;
    --dim: #6f6c93;
    --gold: #edc36c;
    --gold-deep: #c28d3a;
    --display: 'Marcellus SC', 'Trajan Pro', Georgia, serif;
    --serif: 'Cormorant Garamond', Garamond, 'Times New Roman', serif;
    --ui: 'Jost', Futura, 'Avenir Next', 'Segoe UI', sans-serif;
    --pad: max(16px, env(safe-area-inset-left, 0px));
  }
  html, body { height: 100%; margin: 0; background: var(--void); color: var(--mist); overflow: hidden; }
  body { font-family: var(--ui); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  [hidden] { display: none !important; }

  /* Loading */
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--void); transition: opacity 1.4s ease; z-index: 40; }
  body.loaded #loading { opacity: 0; pointer-events: none; }
  #loading .wrap { display: grid; gap: 20px; justify-items: center; padding-inline: 16px; text-align: center; }
  #loading .emblem { width: 74px; height: auto; opacity: 0.9; }
  #loading p { margin: 0; font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--violet); }
  #load-track { width: min(240px, 60vw); height: 1px; background: #262947; overflow: hidden; }
  #load-bar { height: 100%; background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .3s ease; }
  #load-error { max-width: 40ch; color: #f0b3a0; font-family: var(--ui); font-style: normal; font-size: 15px; }

  /* Emblem drawing */
  #title-emblem, #ending-emblem { position: relative; display: grid; place-items: center; }
  .real-logo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 1.6s ease; }
  .emblem { transition: opacity 1.4s ease; }
  .emblem path { transition: stroke .8s ease; }
  .emblem-star { opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(0.2); transition: opacity 1s ease, transform 1.2s cubic-bezier(.2,.9,.2,1); }
  .emblem-star.on { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 6px rgba(237,195,108,.9)); }
  .emblem.draw .part path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s cubic-bezier(.45,.05,.25,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* Title */
  #title { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; pointer-events: auto;
    background: radial-gradient(ellipse at 50% 42%, rgba(4,5,10,.25), rgba(4,5,10,.82) 70%); transition: opacity 1.6s ease; }
  #title.gone { opacity: 0; pointer-events: none; }
  #title .col { display: grid; justify-items: center; gap: 14px; padding: 24px var(--pad); text-align: center; max-width: 640px; }
  #title .emblem { width: clamp(88px, 16vh, 150px); height: auto; margin-bottom: 6px; }
  #title h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(34px, 6.2vw, 72px); letter-spacing: 0.22em; line-height: 1.05; text-wrap: balance; color: #f2eee4; padding-left: 0.22em; }
  #title .by { margin: 0; font-family: var(--serif); font-style: italic; font-size: clamp(18px, 2.2vw, 23px); color: var(--violet); }
  #title .studio { margin: 2px 0 0; font-family: var(--ui); font-weight: 300; font-size: 12.5px; letter-spacing: 0.42em; color: var(--mist); padding-left: 0.42em; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 18px; }
  .btn { pointer-events: auto; cursor: pointer; border: 1px solid rgba(237,195,108,.55); background: rgba(10,12,28,.55); padding: 13px 26px; border-radius: 2px;
    font-family: var(--ui); font-weight: 400; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #f4e6c4; transition: background .3s, border-color .3s, color .3s; }
  .btn:hover, .btn:focus-visible { background: rgba(237,195,108,.14); border-color: var(--gold); color: #fff; outline: none; }
  .btn:focus-visible { box-shadow: 0 0 0 2px rgba(237,195,108,.45); }
  .btn.quiet { border-color: rgba(154,147,207,.35); color: var(--mist); }
  .controls { margin: 10px 0 0; font-size: 12.5px; letter-spacing: 0.06em; color: var(--dim); line-height: 1.7; max-width: 52ch; }
  .controls kbd { font-family: var(--ui); font-size: 11px; border: 1px solid #3a3b5c; border-radius: 3px; padding: 1px 6px; color: var(--mist); }
  .stat { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-deep); }
  .note { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--dim); margin: 0; }

  /* In-game text */
  #subtitle { position: fixed; left: 50%; bottom: calc(9vh + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(880px, calc(100vw - 32px));
    text-align: center; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: clamp(19px, 2.3vw, 30px); line-height: 1.35;
    color: #f3efe6; text-shadow: 0 0 18px rgba(0,0,0,.95), 0 0 4px rgba(0,0,0,.9); opacity: 0; transition: opacity .9s ease; text-wrap: balance; z-index: 12; }
  #subtitle.show { opacity: 1; }
  #subtitle.echo { color: #f6ddb0; }
  #prompt { position: fixed; left: 50%; bottom: calc(3.2vh + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
    font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mist); opacity: 0; transition: opacity .5s; z-index: 12; white-space: nowrap; }
  #prompt.show { opacity: 1; }
  #prompt .key { border: 1px solid var(--gold); color: var(--gold); border-radius: 3px; padding: 3px 9px; letter-spacing: 0.08em; font-weight: 500; }
  #chapter { position: fixed; top: calc(26px + env(safe-area-inset-top, 0px)); left: var(--pad); font-family: var(--display); font-size: clamp(14px, 1.6vw, 18px);
    letter-spacing: 0.34em; color: #efe9dc; opacity: 0; transition: opacity 1.4s ease; z-index: 12; text-shadow: 0 0 12px rgba(0,0,0,.9); }
  #chapter .num { color: var(--gold); margin-right: 14px; }
  #chapter.show { opacity: 0.92; }
  #hint { position: fixed; left: var(--pad); bottom: calc(3.2vh + env(safe-area-inset-bottom, 0px)); font-size: 12px; letter-spacing: 0.12em; color: var(--violet);
    opacity: 0; transition: opacity .8s; z-index: 12; max-width: 34ch; line-height: 1.6; text-shadow: 0 0 10px rgba(0,0,0,.9); }
  #hint.show { opacity: 0.9; }
  #hud { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: grid; justify-items: center; gap: 4px;
    opacity: 0; transition: opacity 1s; z-index: 12; }
  #hud.show { opacity: 1; }
  #hud .emblem { width: 50px; height: auto; filter: drop-shadow(0 0 8px rgba(0,0,0,.8)); }
  #hud .count { font-size: 11px; letter-spacing: 0.24em; color: var(--mist); font-variant-numeric: tabular-nums; padding-left: 0.24em; }
  #hud .gold-layer path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.8s ease; }
  #hud-pause { pointer-events: auto; position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 13;
    background: none; border: 0; color: var(--dim); font-size: 11px; letter-spacing: 0.3em; padding: 8px 10px; cursor: pointer; opacity: 0; transition: opacity .6s; }
  body.playing #hud-pause { opacity: .75; }
  body.touch #hud-pause { font-size: 12px; }

  /* Pause */
  #pause { position: fixed; inset: 0; display: grid; place-items: center; z-index: 35; background: rgba(4,5,10,.78); backdrop-filter: blur(3px); pointer-events: auto; }
  #pause .panel { display: grid; gap: 16px; width: min(420px, calc(100vw - 32px)); padding: 28px 24px; border: 1px solid rgba(154,147,207,.22); background: rgba(10,12,28,.8); }
  #pause h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; letter-spacing: 0.3em; font-size: 20px; color: #efe9dc; text-align: center; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; font-size: 13px; letter-spacing: 0.08em; color: var(--mist); }
  .row input[type=range] { width: 150px; accent-color: var(--gold); }
  .row select { background: #0d1024; color: var(--mist); border: 1px solid #34365a; padding: 6px 8px; font: inherit; }
  .toggle { pointer-events: auto; cursor: pointer; border: 1px solid #34365a; background: #0d1024; padding: 6px 12px; font-size: 12px; letter-spacing: 0.12em; }
  .toggle[aria-pressed=true] { border-color: var(--gold); color: var(--gold); }
  #pause .actions { margin-top: 6px; }

  /* Ending */
  #ending { position: fixed; inset: 0; z-index: 32; background: #000; display: grid; place-items: center; pointer-events: auto; opacity: 0; transition: opacity 2.2s ease; }
  #ending.show { opacity: 1; }
  #sparks { position: absolute; inset: 0; width: 100%; height: 100%; }
  #ending .col { position: relative; display: grid; justify-items: center; gap: 12px; text-align: center; padding: 24px var(--pad); max-width: 680px; }
  #ending .emblem { width: clamp(120px, 26vh, 230px); height: auto; }
  #ending h2 { margin: 8px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(28px, 5vw, 56px); letter-spacing: 0.24em; padding-left: 0.24em; color: #f2eee4; }
  #ending .credit { margin: 0; font-family: var(--serif); font-style: italic; font-size: clamp(17px, 2vw, 21px); color: var(--violet); }
  #ending .closing { margin: 18px 0 0; font-family: var(--serif); font-style: italic; font-size: clamp(20px, 2.6vw, 28px); color: #f6ddb0; }
  #ending .fadein { opacity: 0; transition: opacity 2s ease; }
  #ending .fadein.on { opacity: 1; }

  /* Touch controls */
  #touch { display: none; }
  body.touch #touch { display: block; }
  #joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 1px solid rgba(214,215,238,.25); background: rgba(10,12,28,.25);
    opacity: 0; transition: opacity .2s; z-index: 14; pointer-events: none; }
  #joy.on { opacity: 1; }
  #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(237,195,108,.35); border: 1px solid rgba(237,195,108,.7); }
  .tbtn { position: fixed; z-index: 14; pointer-events: auto; width: 74px; height: 74px; border-radius: 50%; border: 1px solid rgba(214,215,238,.35); background: rgba(10,12,28,.45);
    font-size: 11px; letter-spacing: 0.16em; color: var(--mist); display: grid; place-items: center; touch-action: none; }
  .tbtn.held { border-color: var(--gold); color: var(--gold); background: rgba(237,195,108,.15); }
  #btn-act { right: max(22px, env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); border-color: rgba(237,195,108,.6); color: var(--gold); }
  #btn-listen { right: calc(max(22px, env(safe-area-inset-right, 0px)) + 88px); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  body.touch #prompt { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
  body.touch #subtitle { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01s !important; animation-duration: .01s !important; } }
</style>
</head>
<body>
<div id="stage"></div>

<div id="loading">
  <div class="wrap">
    <div id="load-emblem"></div>
    <p>Gathering the river…</p>
    <div id="load-track"><div id="load-bar"></div></div>
    <p id="load-error" hidden></p>
  </div>
</div>

<div id="title" hidden>
  <div class="col">
    <div id="title-emblem"></div>
    <h1>Endless Destiny</h1>
    <p class="by">Based on the song by Sonny Molina</p>
    <p class="studio">ECHOES IN THE DARK</p>
    <div class="actions">
      <button class="btn" id="btn-begin" type="button">Begin the journey</button>
      <button class="btn quiet" id="btn-settings" type="button">Settings</button>
    </div>
    <p class="controls" id="controls-help"></p>
    <p class="stat" id="title-stat" hidden></p>
    <p class="note">Sound on. The narrator speaks every line.</p>
  </div>
</div>

<div id="chapter"><span class="num"></span><span class="name"></span></div>
<div id="hud"><div id="hud-emblem"></div><div class="count" id="hud-count">0 / 9</div></div>
<button id="hud-pause" type="button" aria-label="Pause">PAUSE</button>
<div id="subtitle" role="status" aria-live="polite"></div>
<div id="prompt"><span class="key"></span><span class="label"></span></div>
<div id="hint"></div>

<div id="pause" hidden>
  <div class="panel" role="dialog" aria-labelledby="pause-title">
    <h2 id="pause-title">PAUSED</h2>
    <div class="row"><span>Narrator voice</span><button class="toggle" id="opt-voice" type="button" aria-pressed="true">On</button></div>
    <div class="row"><label for="opt-volume">Volume</label><input id="opt-volume" type="range" min="0" max="1" step="0.05" value="0.9"></div>
    <div class="row"><label for="opt-sens">Look sensitivity</label><input id="opt-sens" type="range" min="0.4" max="2" step="0.1" value="1"></div>
    <div class="row"><label for="opt-quality">Picture</label>
      <select id="opt-quality"><option value="low">Light (phones)</option><option value="medium">Balanced</option><option value="high">High</option></select></div>
    <div class="actions">
      <button class="btn" id="btn-resume" type="button">Resume</button>
      <button class="btn quiet" id="btn-restart" type="button">Walk again from the river</button>
    </div>
    <p class="controls" id="pause-help"></p>
  </div>
</div>

<div id="ending" hidden>
  <canvas id="sparks"></canvas>
  <div class="col">
    <div id="ending-emblem"></div>
    <h2 class="fadein" id="end-title">ENDLESS DESTINY</h2>
    <p class="credit fadein" id="end-credit">Written and sung by Sonny Molina</p>
    <p class="credit fadein" id="end-studio">An Echoes in the Dark production</p>
    <p class="stat fadein" id="end-stat"></p>
    <p class="closing fadein" id="end-closing"></p>
    <div class="actions fadein" id="end-actions">
      <button class="btn" id="btn-again" type="button">Walk again</button>
      <button class="btn quiet" id="btn-title" type="button">Title</button>
    </div>
  </div>
</div>

<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <button class="tbtn" id="btn-listen" type="button">LISTEN</button>
  <button class="tbtn" id="btn-act" type="button">ACT</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
