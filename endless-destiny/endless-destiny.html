<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Endless Destiny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4efe6;--dim:rgba(244,239,230,.55);--gold:#e8c478;--bg:#000;--panel:rgba(10,10,12,.72);--line:rgba(255,255,255,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#f4efe6;--bg:#000}}
:root[data-theme="dark"]{--ink:#f4efe6;--bg:#000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:Jost,system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:none}
body.ui canvas{cursor:default}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#000;z-index:5;text-align:center;padding:16px;transition:opacity 1.6s}
#gate.gone{opacity:0;pointer-events:none}
#gate h1{font-weight:200;letter-spacing:.55em;font-size:clamp(20px,4.4vw,46px);margin-right:-.55em}
#gate p{font-weight:300;color:var(--dim);letter-spacing:.18em;font-size:clamp(11px,1.5vw,13px);text-transform:uppercase;line-height:2}
#gate .gold{color:var(--gold)}
#begin{margin-top:10px;background:none;border:1px solid rgba(232,196,120,.6);color:var(--ink);font:300 13px Jost,sans-serif;letter-spacing:.45em;padding:16px 34px 16px 40px;cursor:pointer;transition:.4s}
#begin:hover{background:rgba(232,196,120,.12);border-color:var(--gold)}
#gate .row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:12px;letter-spacing:.14em;color:var(--dim)}
#gate label{cursor:pointer;display:flex;gap:8px;align-items:center}
#gate input[type=checkbox]{accent-color:#e8c478}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .5s;font-size:12px;letter-spacing:.12em;flex-wrap:wrap}
body.ui #bar{opacity:1}
#bar button,#bar label.btn{background:none;border:1px solid var(--line);color:var(--ink);font:300 11px Jost,sans-serif;letter-spacing:.18em;padding:7px 12px;cursor:pointer;text-transform:uppercase}
#bar button:hover,#bar label.btn:hover{border-color:var(--gold)}
#bar input[type=range]{flex:1;min-width:120px;accent-color:#e8c478}
#time{min-width:92px;font-variant-numeric:tabular-nums;color:var(--dim)}
#chap{color:var(--gold);min-width:150px}
#bar input[type=file]{display:none}
@media (max-width:640px){#chap{display:none}#bar{gap:8px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="gate">
  <p class="gold">Echoes in the Dark presents</p>
  <h1>ENDLESS DESTINY</h1>
  <p>A nine-minute cinematic sequence<br>Headphones · Fullscreen · Lights off</p>
  <div class="row">
    <label><input type="checkbox" id="optNarr" checked> Narration</label>
    <label><input type="checkbox" id="optSubs" checked> Subtitles</label>
    <label><input type="checkbox" id="optFull" checked> Fullscreen</label>
  </div>
  <button id="begin">BEGIN</button>
</div>

<div id="bar">
  <button id="bPlay">Pause</button>
  <span id="time">0:00 / 9:00</span>
  <input id="scrub" type="range" min="0" max="540" step="0.1" value="0">
  <span id="chap"></span>
  <label class="btn" title="Play your own track of the song under the sound design">Load song<input type="file" id="song" accept="audio/*"></label>
  <button id="bRec" title="Records picture + sound design to a .webm file (browser narration voice can't be captured; subtitles are burned in)">Export .webm</button>
  <button id="bFull">Fullscreen</button>
</div>

function drawEye() {

const GLYPHS = [
  (c, s) => { c.moveTo(-s, -s); c.lineTo(s, -s); c.lineTo(-s, s); c.lineTo(s, s); c.closePath(); },               // hourglass: time
  (c, s) => { c.moveTo(-s, 0); c.lineTo(s, 0); c.moveTo(s * .4, -s * .5); c.lineTo(s, 0); c.lineTo(s * .4, s * .5); }, // arrow: direction
  (c, s) => { c.moveTo(0, s); c.lineTo(0, 0); c.lineTo(-s * .8, -s); c.moveTo(0, 0); c.lineTo(s * .8, -s); },          // fork: choice
  (c, s) => { c.arc(0, 0, s, .5, TAU - .5); },                                                                          // broken ring: ending → beginning
  (c, s) => { for (let k = 0; k < 40; k++) { const a = k * .3, r = s * k / 40; k ? c.lineTo(Math.cos(a) * r, Math.sin(a) * r) : c.moveTo(0, 0); } }, // spiral: continuation
  (c, s) => { c.moveTo(-s * .5, s); c.lineTo(-s * .5, -s * .6); c.arc(0, -s * .6, s * .5, Math.PI, 0); c.lineTo(s * .5, s); }, // doorway: beginning
  (c, s) => { for (let k = 1; k < 4; k++) { c.moveTo(s * k / 3 * Math.cos(-.8), s * k / 3 * Math.sin(-.8)); c.arc(0, 0, s * k / 3, -.8, .8); } }, // echo arcs: memory
  (c, s) => { for (let k = -3; k <= 3; k++) { c.moveTo(k * s / 3, 0); c.lineTo(k * s / 3 + s * .08, 0); } },           // distance
  (c, s) => { c.moveTo(-s, 0); for (let k = 0; k <= 20; k++) c.lineTo(-s + k / 10 * s, Math.sin(k * 1.3) * s * .3 * (hash(k) + .3)); } // uncertainty
];

function drawTunnel() {
  const a = win(397.5, 399.5, 419, 421);
  if (a <= .005) return;
  const tt = (T - 398) * 260 + Math.pow(seg(410, 420), 2) * 900;
  const FOV = MIN * .5, SP_ = 110, NR = 26;
  for (let k = 0; k < NR; k++) {
    const idx = Math.floor(tt / SP_) + NR - k;
    const z = idx * SP_ - tt; if (z < 20) continue;
    const R = FOV * 260 / z, fade = clamp(1 - z / (NR * SP_)) * clamp(z / 200);
    const rot = idx * .7 + T * .2 * (idx % 2 ? 1 : -1);
    const wob = Math.sin(idx * .9 + T) * R * .05;
    for (let p = 0; p < 30; p++) { const an = p / 30 * TAU + rot; dot(p % 6 ? SP.c : SP.g, CX + Math.cos(an) * R + wob, CY + Math.sin(an) * R, 1.5 + R * .012, a * fade * .8); }

    ctx.globalAlpha = a * fade * .35; ctx.beginPath(); ctx.arc(CX + wob, CY, R, rot, rot + TAU * (.3 + hash(idx) * .6)); ctx.stroke();

  dot(SP.soft, CX, CY, MIN * (.1 + e * .7), a * (.15 + e * .45));

}

function drawCollapseArcs() {

function drawFinalPath() {

  const lr = logoR(), [lx, ly] = logoC();
  const u = lr; // path is built in logo units so it scales with the camera

}

/* title: "ENDLESS DESTINY" formed from fragments of light */
let TITLE = null;
function buildTitle() {
  const text = 'ENDLESS DESTINY';
  const fs = Math.round(Math.min(W * .052, 68, H * .085)), sp = fs * .42;
  const c = mk(Math.ceil(W), Math.ceil(fs * 2)), x = c.getContext('2d');
  x.font = `200 ${fs}px Jost, 'Helvetica Neue', sans-serif`; x.textBaseline = 'middle'; x.fillStyle = '#fff';
  const widths = [...text].map(ch => x.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + sp * (text.length - 1);
  let px = (W - total) / 2; const letters = [];
  [...text].forEach((ch, i) => { letters.push({ ch, x: px, w: widths[i] }); x.fillText(ch, px, fs); px += widths[i] + sp; });
  const d = x.getImageData(0, 0, c.width, c.height).data, pts = [];
  const stepPx = Math.max(1, Math.round(fs / 34));
  for (let yy = 0; yy < c.height; yy += stepPx) for (let xx = 0; xx < c.width; xx += stepPx) if (d[(yy * c.width + xx) * 4 + 3] > 120) {
    let li = 0; for (let k = 0; k < letters.length; k++) if (xx >= letters[k].x - 1) li = k; pts.push([xx, yy - fs, li]); }
  TITLE = { c, fs, pts, letters, n: text.length };
}
function drawTitle() {
  if (T < 523 || !TITLE) return;
  const lr = logoR(), [, ly] = logoC();
  const ty = Math.min(ly + lr * 1.28 + TITLE.fs * .9, H - TITLE.fs * 2.6);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < TITLE.pts.length; i += 1) {
    const [x, y, li] = TITLE.pts[i]; const st = 524 + li * .38 + hash(i) * .6;
    const p = ease3((T - st) / 2.2); if (p <= 0) continue;
    const ox = x + (hash(i * 3) - .5) * W * .7, oy = ty + y + (hash(i * 7) - .5) * H * .6 - H * .1;
    const px = lerp(ox, x, p), py = lerp(oy, ty + y, p);
    const fadeOut = 1 - sm((T - st - 2.4) / 1.4);
    dot(hash(i) > .85 ? SP.g : SP.w, px, py, 2.2, (.25 + .75 * p) * (.3 + .7 * fadeOut) * .8);
  }
  // crisp letters resolve out of the light
  ctx.save(); ctx.font = `200 ${TITLE.fs}px Jost, 'Helvetica Neue', sans-serif`; ctx.textBaseline = 'middle'; ctx.fillStyle = '#f6f0e4';
  ctx.globalCompositeOperation = 'source-over';
  TITLE.letters.forEach((L, i) => { const a = sm((T - (524 + i * .38 + 1.8)) / 1.6); if (a <= 0) return; ctx.globalAlpha = a; ctx.fillText(L.ch, L.x, ty); });
  ctx.restore();
  // presented by — the studio wordmark
  const wa = sm(seg(533, 536.5));
  if (wa > 0 && WORD_IMG.complete) { const ww = Math.min(W * .3, 300), wh = ww / LOGO.wordAspect; ctx.globalAlpha = wa * .7; ctx.drawImage(WORD_IMG, CX - ww / 2, Math.min(ty + TITLE.fs * 1.5, H - wh - 24), ww, wh); }
}

function drawSubtitle() {
  if (!OPT.subs) return;
  const n = NARR.find(n => T >= n.t && T < n.t + n.dur); if (!n) return;
  const a = sm((T - n.t) / .6) * (1 - sm((T - (n.t + n.dur - .8)) / .8));
  const fs = Math.round(clamp(MIN * .028, 13, 22));
  ctx.save(); ctx.globalCompositeOperation = 'source-over';
  ctx.font = `300 ${fs}px Jost, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${fs * .12}px`;
  const maxW = Math.min(W - 32, 760), words = n.s.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  lines.push(cur);
  const y0 = H - 54 - (lines.length - 1) * fs * 1.5 - (T > 523 ? 0 : 0);
  ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 12;
  ctx.fillStyle = 'rgba(244,239,230,1)'; ctx.globalAlpha = a * .92;

}

let lastFrame = performance.now(), frameAvg = 16;
function render() {
  const P = K(PERSIST);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  if (P > .01) {
    // feedback: zoom the previous frame toward the camera (folding space / tunnel smear)
    ctx.globalAlpha = P * .55; const z = 1.012 + P * .02;
    const w = cv.width, h = cv.height;
    ctx.drawImage(cv, (w - w * z) / 2, (h - h * z) / 2, w * z, h * z);
    ctx.globalAlpha = 1 - P * .75; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  } else { ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'lighter';

  const sh = K(SHAKE), shx = (hash(Math.floor(T * 40)) - .5) * sh, shy = (hash(Math.floor(T * 40) + 7) - .5) * sh;
  const roll = K(ROLL);
  ctx.save();
  ctx.translate(CX + shx, CY + shy); ctx.rotate(roll); ctx.translate(-CX, -CY);

  drawNebula(K(NEB_A));
  drawGalaxies(K(GAL_A));
  drawStars(K(STAR_A));
  drawWaves(win(6, 20, 34, 46) + win(224, 232, 262, 280) * .5);
  drawDust(win(2, 10, 460, 465) * .8 + win(483, 484, 530, 540) * .6);
  drawPoint();
  cosmosZoom(win(88.3, 89.5, 147, 151.5), 88.3, .15, 3);
  cosmosZoom(win(361.8, 364, 381, 386), 361.8, .2, 71);
  drawRoad(); drawPathways(); drawFracture(); drawMorph();
  drawEye(); drawTunnel(); drawCollapseArcs();
  ctx.restore();

  // logo space (rolls only a little so the symbol stays readable)
  ctx.save(); ctx.translate(CX + shx, CY + shy); ctx.rotate(roll * .08); ctx.translate(-CX, -CY);
  const lr = logoR(), [lx, ly] = logoC();
  drawRays(K(RAYS) * logoVis(), lx, ly, MIN * 1.3);
  drawFinalPath();
  drawShocks(lx, ly);
  drawLogo();
  drawBurst(lx, ly);
  drawSpark();
  drawSilenceMotes();
  ctx.restore();

  // flashes
  let fl = 0; for (const [ft, amt, dec] of FLASHES) { const d = T - ft; if (d >= 0 && d < dec * 3) fl += amt * Math.exp(-d / dec * 2.2) * clamp(d / .04); }
  if (fl > .004) { ctx.globalAlpha = clamp(fl); ctx.fillStyle = 'rgb(255,246,232)'; ctx.fillRect(0, 0, W, H); }

  drawTitle();

  // grade: vignette, grain, fade to black at the edges of the film
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1; ctx.drawImage(VIGNETTE, -W * .1, -H * .1, W * 1.2, H * 1.2);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .028;
  const gx = -Math.random() * 256, gy = -Math.random() * 256;
  for (let x = gx; x < W; x += 256) for (let y = gy; y < H; y += 256) ctx.drawImage(GRAIN, x, y);
  ctx.globalCompositeOperation = 'source-over';
  const endFade = sm(seg(538.5, 540.5)) * .0; if (endFade > 0) { ctx.globalAlpha = endFade; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  drawSubtitle();
  ctx.globalAlpha = 1;
}

/* =====================================================================
   AUDIO — everything synthesized
   ===================================================================== */
let AC = null, master, comp, revIn, evBus, evRev, evMus, evMusRev, recDest, BEDS = {}, WHITE, BROWN, CRACK, IR;

  BROWN = AC.createBuffer(1, sr * 4, sr); { const d = BROWN.getChannelData(0); let l = 0; for (let i = 0; i < d.length; i++) { l = (l + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = l * 3.5; } }

buildCues(); CUES.sort((a, b) => a.t - b.t);
let ci = 0;
function scheduleCues() {
  if (!AC || state !== 'playing') return;
  while (ci < CUES.length && CUES[ci].t <= T + .3) {
    const c = CUES[ci++]; if (c.t < T - .25) continue;
    try { c.fn(Math.max(AC.currentTime + .01, t0 + c.t)); } catch (e) { console.warn(e); }
  }
}

/* ---- narration via speech synthesis ---- */
let VOICE = null;
function pickVoice() {
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const en = vs.filter(v => /^en/i.test(v.lang));
  const pref = [/Daniel/i, /Google UK English Male/i, /Arthur/i, /Guy/i, /Ryan/i, /Christopher/i, /Male/i, /Alex/i, /Fred/i, /Thomas/i];
  for (const r of pref) { const v = en.find(v => r.test(v.name)); if (v) return (VOICE = v); }
  VOICE = en[0] || vs[0] || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function narrate() {
  for (const n of NARR) {
    if (!n.done && T >= n.t) {
      n.done = true;
      if (OPT.narr && window.speechSynthesis && T < n.t + 1.5) {
        const u = new SpeechSynthesisUtterance(n.s.replace(/…/g, '...'));
        if (VOICE) u.voice = VOICE; u.rate = .8; u.pitch = .55; u.volume = 1;
        speechSynthesis.speak(u);
      }
    }
  }
}

/* =====================================================================
   TRANSPORT
   ===================================================================== */
const OPT = { narr: true, subs: true };
let state = 'idle', t0 = 0, pausedAt = 0;
const Q = new URLSearchParams(location.search);
function seek(t) {
  t = clamp(t, 0, DUR);
  if (window.speechSynthesis) speechSynthesis.cancel();
  NARR.forEach(n => n.done = n.t < t - .01);
  ci = 0; while (ci < CUES.length && CUES[ci].t < t) ci++;
  if (AC) { newBus(); t0 = AC.currentTime - t; }
  pausedAt = t; T = t;
  if (songEl) { songEl.currentTime = t; }
}
function play() {
  if (!AC) return;
  AC.resume(); t0 = AC.currentTime - pausedAt; state = 'playing';
  if (window.speechSynthesis) speechSynthesis.resume();
  if (songEl) { songEl.currentTime = pausedAt; songEl.play(); }
  bPlay.textContent = 'Pause';
}
function pause() {
  if (state !== 'playing') return;
  pausedAt = T; state = 'paused';
  if (window.speechSynthesis) speechSynthesis.pause();
  if (songEl) songEl.pause();
  updateBeds();
  setTimeout(() => { if (state === 'paused') AC.suspend(); }, 250);
  bPlay.textContent = 'Play';
}

const gate = document.getElementById('gate'), bPlay = document.getElementById('bPlay'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), chapEl = document.getElementById('chap');
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
document.getElementById('begin').onclick = async () => {
  OPT.narr = document.getElementById('optNarr').checked; OPT.subs = document.getElementById('optSubs').checked;
  if (document.getElementById('optFull').checked && document.documentElement.requestFullscreen) { try { await document.documentElement.requestFullscreen(); } catch (e) {} }
  initAudio(); gate.classList.add('gone');
  // tiny unlock utterance for iOS/Safari
  if (window.speechSynthesis && OPT.narr) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
  seek(Number(Q.get('t')) || 0); play();
};
bPlay.onclick = () => state === 'playing' ? pause() : (T >= DUR ? (seek(0), play()) : play());
scrub.oninput = () => { const was = state; seek(Number(scrub.value)); if (was === 'playing') t0 = AC.currentTime - T; };
document.getElementById('bFull').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.getElementById('song').onchange = e => {
  const f = e.target.files[0]; if (!f || !AC) return;
  if (!songEl) { songEl = new Audio(); songEl.crossOrigin = 'anonymous'; songNode = AC.createMediaElementSource(songEl); songGain = G(.9); songNode.connect(songGain); songGain.connect(master); }
  songEl.src = URL.createObjectURL(f); musicLevel = .25; if (evMus) { evMus.gain.value = musicLevel; evMusRev.gain.value = musicLevel; }
  songEl.currentTime = T; if (state === 'playing') songEl.play();
};
let rec = null;
document.getElementById('bRec').onclick = () => {
  if (!AC) return;
  if (rec) { rec.stop(); return; }
  const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 }); const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = 'endless-destiny.webm'; a.click(); rec = null; document.getElementById('bRec').textContent = 'Export .webm'; };
  seek(0); play(); rec.start(1000); document.getElementById('bRec').textContent = 'Stop export';
};
addEventListener('keydown', e => {
  if (!AC) return;
  if (e.code === 'Space') { e.preventDefault(); bPlay.click(); }
  if (e.code === 'ArrowRight') seek(T + 10), state === 'playing' && (t0 = AC.currentTime - T);
  if (e.code === 'ArrowLeft') seek(T - 10), state === 'playing' && (t0 = AC.currentTime - T);
  if (e.key === 'f') document.getElementById('bFull').click();
  if (/^[0-9]$/.test(e.key)) { const c = CHAPTERS[Number(e.key)]; if (c) { seek(c[0]); if (state === 'playing') t0 = AC.currentTime - T; } }
});
let uiTimer = 0;
addEventListener('mousemove', () => { document.body.classList.add('ui'); clearTimeout(uiTimer); uiTimer = setTimeout(() => document.body.classList.remove('ui'), 2200); });
addEventListener('touchstart', () => { document.body.classList.add('ui'); clearTimeout(uiTimer); uiTimer = setTimeout(() => document.body.classList.remove('ui'), 3000); }, { passive: true });
addEventListener('resize', resize);

function frame(now) {
  requestAnimationFrame(frame);
  const dt = now - lastFrame; lastFrame = now; frameAvg = frameAvg * .95 + dt * .05;
  if (frameAvg > 30 && QUALITY > .6) { QUALITY = .5; resize(); }
  if (state === 'playing') {
    T = AC.currentTime - t0;
    if (T >= DUR + 4) { pause(); T = DUR; }
    if (rec && T >= DUR + 3) rec.stop();
    scheduleCues(); narrate();
  }
  updateBeds();
  const Tr = Math.min(T, DUR);
  const keep = T; T = Tr; render(); T = keep;
  scrub.value = Tr; timeEl.textContent = `${fmt(Tr)} / ${fmt(DUR)}`;
  let ch = CHAPTERS[0][1]; for (const c of CHAPTERS) if (Tr >= c[0]) ch = c[1]; chapEl.textContent = ch;
}
resize();
if (Q.has('still')) { gate.style.display = 'none'; T = Number(Q.get('t')) || 0; pausedAt = T; }
document.fonts && document.fonts.ready.then(() => resize());
requestAnimationFrame(frame);
