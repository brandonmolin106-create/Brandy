<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Endless Destiny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4efe6;--dim:rgba(244,239,230,.55);--gold:#e8c478;--bg:#000;--panel:rgba(10,10,12,.72);--line:rgba(255,255,255,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#f4efe6;--bg:#000}}
:root[data-theme="dark"]{--ink:#f4efe6;--bg:#000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:Jost,system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:none}
body.ui canvas{cursor:default}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#000;z-index:5;text-align:center;padding:16px;transition:opacity 1.6s}
#gate.gone{opacity:0;pointer-events:none}
#gate h1{font-weight:200;letter-spacing:.55em;font-size:clamp(20px,4.4vw,46px);margin-right:-.55em}
#gate p{font-weight:300;color:var(--dim);letter-spacing:.18em;font-size:clamp(11px,1.5vw,13px);text-transform:uppercase;line-height:2}
#gate .gold{color:var(--gold)}
#begin{margin-top:10px;background:none;border:1px solid rgba(232,196,120,.6);color:var(--ink);font:300 13px Jost,sans-serif;letter-spacing:.45em;padding:16px 34px 16px 40px;cursor:pointer;transition:.4s}
#begin:hover{background:rgba(232,196,120,.12);border-color:var(--gold)}
#gate .row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:12px;letter-spacing:.14em;color:var(--dim)}
#gate label{cursor:pointer;display:flex;gap:8px;align-items:center}
#gate input[type=checkbox]{accent-color:#e8c478}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .5s;font-size:12px;letter-spacing:.12em;flex-wrap:wrap}
body.ui #bar{opacity:1}
#bar button,#bar label.btn{background:none;border:1px solid var(--line);color:var(--ink);font:300 11px Jost,sans-serif;letter-spacing:.18em;padding:7px 12px;cursor:pointer;text-transform:uppercase}
#bar button:hover,#bar label.btn:hover{border-color:var(--gold)}
#bar input[type=range]{flex:1;min-width:120px;accent-color:#e8c478}
#time{min-width:92px;font-variant-numeric:tabular-nums;color:var(--dim)}
#chap{color:var(--gold);min-width:150px}
#bar input[type=file]{display:none}
@media (max-width:640px){#chap{display:none}#bar{gap:8px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="gate">
  <p class="gold">Echoes in the Dark presents</p>
  <h1>ENDLESS DESTINY</h1>
  <p>A nine-minute cinematic sequence<br>Headphones · Fullscreen · Lights off</p>
  <div class="row">
    <label><input type="checkbox" id="optNarr" checked> Narration</label>
    <label><input type="checkbox" id="optSubs" checked> Subtitles</label>
    <label><input type="checkbox" id="optFull" checked> Fullscreen</label>
  </div>
  <button id="begin">BEGIN</button>
</div>

<div id="bar">
  <button id="bPlay">Pause</button>
  <span id="time">0:00 / 9:00</span>
  <input id="scrub" type="range" min="0" max="540" step="0.1" value="0">
  <span id="chap"></span>
  <label class="btn" title="Play your own track of the song under the sound design">Load song<input type="file" id="song" accept="audio/*"></label>
  <button id="bRec" title="Records picture + sound design to a .webm file (browser narration voice can't be captured; subtitles are burned in)">Export .webm</button>
  <button id="bFull">Fullscreen</button>
</div>

<script>
/* =====================================================================
   ENDLESS DESTINY — real-time cinematic sequence
   Echoes in the Dark
   Every visual is a pure function of time T, so the film can be scrubbed.
   All sound is synthesized live with the Web Audio API.
   ===================================================================== */
const LOGO = /*__LOGO__*/null;
const DUR = 540;
const TAU = Math.PI * 2;

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, x) => a + (b - a) * x;
const sm = x => (x = clamp(x), x * x * (3 - 2 * x));
const ease3 = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
let T = 0;
const seg = (a, b) => clamp((T - a) / (b - a));
const win = (a, b, c, d) => sm((T - a) / (b - a)) * (1 - sm((T - c) / (d - c)));
function K(arr, x = T) {
  if (x <= arr[0][0]) return arr[0][1];
  for (let i = 1; i < arr.length; i++) {
    if (x <= arr[i][0]) {
      const [a, va] = arr[i - 1], [b, vb] = arr[i];
      return b === a ? vb : va + (vb - va) * sm((x - a) / (b - a));
    }
  }
  return arr[arr.length - 1][1];
}
// log-space keyframes (for scales / zooms)
function KL(arr, x = T) { return Math.exp(K(arr.map(([t, v]) => [t, Math.log(v)]), x)); }

/* ---------- canvas ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, MIN = 0, QUALITY = 1;
let VIGNETTE, GRAIN;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, QUALITY > .8 ? 1.5 : 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  CX = W / 2; CY = H / 2; MIN = Math.min(W, H);
  VIGNETTE = document.createElement('canvas'); VIGNETTE.width = 512; VIGNETTE.height = 512;
  const v = VIGNETTE.getContext('2d');
  const g = v.createRadialGradient(256, 256, 120, 256, 256, 362);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.78)');
  v.fillStyle = g; v.fillRect(0, 0, 512, 512);
  buildTitle();
}

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h || w; return c; }
function sprite(r, g, b, size = 64, core = .12) {
  const c = mk(size), x = c.getContext('2d');
  const gr = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
  gr.addColorStop(core, `rgba(${r},${g},${b},.55)`);
  gr.addColorStop(.4, `rgba(${r},${g},${b},.1)`);
  gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, size, size); return c;
}
const SP = {
  w: sprite(255, 250, 244), g: sprite(242, 198, 118), b: sprite(130, 180, 255),
  c: sprite(110, 225, 255), v: sprite(180, 140, 255), r: sprite(255, 150, 110),
  soft: sprite(255, 250, 240, 128, .02)
};
function dot(s, x, y, r, a) {
  if (a <= .004 || r <= 0) return;
  if (x < -r || y < -r || x > W + r || y > H + r) return;
  ctx.globalAlpha = a > 1 ? 1 : a;
  ctx.drawImage(s, x - r, y - r, r * 2, r * 2);
}

/* grain */
(function () { GRAIN = mk(256); const x = GRAIN.getContext('2d'); const d = x.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); })();

/* nebula textures */
function nebula(seed, cols) {
  const c = mk(512), x = c.getContext('2d');
  x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 260; i++) {
    const u = hash(seed + i * 3.1), v = hash(seed + i * 7.7);
    // cluster along a curving river
    const px = 256 + (u - .5) * 420, py = 256 + Math.sin(u * 5 + seed) * 120 + (v - .5) * 150;
    const r = 20 + hash(seed + i) * 90;
    const col = cols[i % cols.length];
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, `rgba(${col},${.05 + hash(i + seed * 2) * .07})`); g.addColorStop(1, `rgba(${col},0)`);
    x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  // dark dust lanes
  x.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 70; i++) {
    const px = hash(seed + i * 11) * 512, py = 256 + Math.sin(px / 60 + seed) * 90 + (hash(i * 5 + seed) - .5) * 60, r = 10 + hash(i + seed * 9) * 40;
    const g = x.createRadialGradient(px, py, 0, px, py, r); g.addColorStop(0, 'rgba(0,0,0,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  // soft pass
  const o = mk(512), ox = o.getContext('2d'); ox.filter = 'blur(6px)'; ox.drawImage(c, 0, 0); return o;
}
const NEB = [
  nebula(1, ['40,80,170', '30,120,160', '60,60,150']),
  nebula(7, ['90,60,150', '120,70,130', '50,50,130']),
  nebula(13, ['200,150,90', '160,110,70', '90,120,170'])
];
/* galaxies */
function galaxy(seed, tint) {
  const c = mk(256), x = c.getContext('2d'); x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 2600; i++) {
    const arm = i % 2, u = hash(seed + i * 1.37), rr = Math.pow(u, .7) * 118;
    const a = arm * Math.PI + rr * .045 + (hash(seed + i * 2.9) - .5) * (0.9 - u * .5);
    const px = 128 + Math.cos(a) * rr, py = 128 + Math.sin(a) * rr * .42;
    const al = (1 - u) * .5 + .08;
    x.fillStyle = `rgba(${u < .2 ? '255,236,200' : tint},${al})`; x.fillRect(px, py, 1.1, 1.1);
  }
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 40); g.addColorStop(0, 'rgba(255,235,200,.9)'); g.addColorStop(1, 'rgba(255,235,200,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256); return c;
}
const GAL = [galaxy(3, '150,190,255'), galaxy(9, '220,170,255'), galaxy(21, '255,210,160')];
const GALPOS = [[-.62, -.3, .9, .3], [.7, .28, .6, -.5], [.35, -.62, .45, 1.1], [-.4, .55, .5, 2.2], [.05, .75, .35, .7]];

/* ray sprite */
const RAY = (() => { const c = mk(64, 512), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 512, 0, 0); g.addColorStop(0, 'rgba(255,240,215,.55)'); g.addColorStop(.35, 'rgba(255,230,200,.12)'); g.addColorStop(1, 'rgba(255,230,200,0)');
  x.fillStyle = g; x.beginPath(); x.moveTo(30, 512); x.lineTo(34, 512); x.lineTo(64, 0); x.lineTo(0, 0); x.closePath(); x.fill(); return c; })();

/* ---------- logo assets ---------- */
const LOGO_IMG = new Image(), STAR_IMG = new Image(), WORD_IMG = new Image();
let LOGO_GLOW = null;
LOGO_IMG.onload = () => { LOGO_GLOW = mk(512); const x = LOGO_GLOW.getContext('2d'); x.filter = 'blur(14px)'; x.drawImage(LOGO_IMG, 32, 32, 448, 448); x.filter = 'blur(4px)'; x.drawImage(LOGO_IMG, 32, 32, 448, 448); };
LOGO_IMG.src = 'data:image/png;base64,' + LOGO.lines;
STAR_IMG.src = 'data:image/png;base64,' + LOGO.star;
WORD_IMG.src = 'data:image/png;base64,' + LOGO.word;
const LP = LOGO.pts; // [x,y,geodesicDistFromStar] in -1..1
const LN = LP.length;
const LKEY = new Float32Array(LN), LTH = new Float32Array(LN), LSC = new Float32Array(LN);
for (let i = 0; i < LN; i++) {
  LKEY[i] = .5 * LP[i][2] + .5 * hash(i * 1.91);
  LTH[i] = (hash(i * 3.3) - .5) * 1.6 + (LP[i][0] > 0 ? .4 : -.4);
  LSC[i] = .25 + hash(i * 5.7) * .5;
}
// outer boundary points by angle (for edge lightning)
const OUTER = (() => { const bins = new Array(90).fill(null);
  for (const p of LP) { const a = Math.atan2(p[1] - .05, p[0]), r = Math.hypot(p[0], p[1] - .05); const b = Math.floor((a + Math.PI) / TAU * 90) % 90; if (!bins[b] || bins[b][2] < r) bins[b] = [p[0], p[1], r]; }
  return bins.filter(Boolean); })();
// a point inside the logo to dive into
const DIVE = LP.reduce((best, p) => { const d = Math.hypot(p[0] - .2, p[1] - .15); return d < best[2] ? [p[0], p[1], d] : best; }, [0, 0, 9]);

/* ---------- procedural structures ---------- */
const TREE = (() => { const segs = [];
  function br(x, y, a, len, d, s) { if (d > 6) return; const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len; segs.push([x, y, x2, y2, d]);
    const n = hash(s) > .35 ? 2 : 1; for (let k = 0; k < n; k++) br(x2, y2, a + (hash(s + k * 9) - .5) * 1.3, len * (.62 + hash(s + k) * .2), d + 1, s * 1.7 + k * 13 + 1); }
  for (let i = 0; i < 7; i++) br(0, 0, i / 7 * TAU, .22, 0, i * 31 + 5); return segs; })();
const CONST = (() => { const n = []; for (let i = 0; i < 26; i++) { const a = hash(i * 4.1) * TAU, r = .25 + hash(i * 8.3) * .75; n.push([Math.cos(a) * r, Math.sin(a) * r]); }
  const e = []; n.forEach((p, i) => { const d = n.map((q, j) => [Math.hypot(p[0] - q[0], p[1] - q[1]), j]).sort((a, b) => a[0] - b[0]); e.push([i, d[1][1]], [i, d[2][1]]); }); return { n, e }; })();

// celestial pathways: normalized bezier curves across the sky
const PATHWAYS = Array.from({ length: 16 }, (_, i) => { const y0 = .15 + hash(i * 2.2) * .7;
  return [[-.1, y0], [.2 + hash(i * 3) * .3, hash(i * 5) * 1], [.5 + hash(i * 7) * .3, hash(i * 11)], [1.1, .1 + hash(i * 13) * .8]]; });
function bez(p, u) { const v = 1 - u; return [v * v * v * p[0][0] + 3 * v * v * u * p[1][0] + 3 * v * u * u * p[2][0] + u * u * u * p[3][0], v * v * v * p[0][1] + 3 * v * v * u * p[1][1] + 3 * v * u * u * p[2][1] + u * u * u * p[3][1]]; }

// fracture network: thousands of branching possibilities
const FRACT = (() => { const paths = []; let s = 1;
  function grow(x, y, a, born, depth) { const pts = [[x, y]]; const fate = hash(s++ * 1.3); const n = 14 + Math.floor(hash(s++) * 18);
    let ca = a; for (let k = 0; k < n; k++) { ca += (hash(s++) - .5) * .5; if (fate > .8) ca += .16; // curve backward
      x += Math.cos(ca) * .022; y += Math.sin(ca) * .022; pts.push([x, y]);
      if (depth < 4 && hash(s++) < .085 && paths.length < 520) grow(x, y, ca + (hash(s++) - .5) * 1.6, born + k / n * .25, depth + 1); }
    paths.push({ pts, born, fate }); }
  for (let i = 0; i < 9; i++) grow(0, 0, -Math.PI / 2 + (i - 4) * .32, 0, 0);
  return paths; })();

// morph chain shapes (N points each, unit space)
const MN = 900;
const SHAPES = (() => { const S = [];
  const g = i => { const a = hash(i * 1.1) * TAU, r = Math.sqrt(-2 * Math.log(hash(i * 2.3) + 1e-4)) * .1; return [Math.cos(a) * r, Math.sin(a) * r]; };
  S.push(Array.from({ length: MN }, (_, i) => g(i)));                                          // star
  S.push(Array.from({ length: MN }, (_, i) => { const u = i / MN * 2.6; let x, y;                 // doorway (arch)
    if (u < .9) { x = -.32; y = .55 - u / .9 * .95; } else if (u < 1.7) { const a = Math.PI + (u - .9) / .8 * Math.PI; x = Math.cos(a) * .32; y = -.4 + Math.sin(a) * .32; }
    else { x = .32; y = -.4 + (u - 1.7) / .9 * .95; } return [x + (hash(i) - .5) * .012, y + (hash(i + 9) - .5) * .012]; }));
  S.push(Array.from({ length: MN }, (_, i) => { const x = (i / MN - .5) * 5; return [x, .25 + x * x * .015 + (hash(i) - .5) * .02 * Math.exp(-x * x)]; })); // horizon
  S.push(Array.from({ length: MN }, (_, i) => [(i / MN - .5) * 1.6, (hash(i) - .5) * .004]));   // line
  const nodes = [[-.6, .1], [-.35, -.25], [-.1, -.05], [.12, -.38], [.4, -.2], [.62, .15], [.3, .3], [-.05, .35]];
  S.push(Array.from({ length: MN }, (_, i) => { if (i % 3) { const n = nodes[i % nodes.length]; const [dx, dy] = g(i); return [n[0] + dx * .15, n[1] + dy * .15]; }
    const a = nodes[i % nodes.length], b = nodes[(i + 1) % nodes.length], u = hash(i * 3.7); return [lerp(a[0], b[0], u), lerp(a[1], b[1], u)]; }));  // constellation
  S.push(Array.from({ length: MN }, (_, i) => { const a = i / MN * TAU; return [Math.cos(a) * .62, Math.sin(a) * .62]; }));  // circle
  S.push(Array.from({ length: MN }, (_, i) => { const u = i / MN; const a = -Math.PI / 2 + u * 2.2; const r = .62 + u * 2.4; return [Math.cos(a) * r * (1 - u * .3) + u * 1.2, Math.sin(a) * r * .6 - u * .9]; })); // opened path
  return S; })();
const SHAPE_T = [198, 202, 206, 210, 214, 218, 222, 227];

/* stars */
const NST = 2400, ZR = 3000, SPREAD = 4200;
const ST = Array.from({ length: NST }, (_, i) => ({ x: (hash(i * 1.7) - .5) * SPREAD, y: (hash(i * 2.9) - .5) * SPREAD, z: hash(i * 4.3) * ZR, m: Math.pow(hash(i * 6.1), 3) * .9 + .1, c: hash(i * 8.8) }));

/* ---------- timeline curves ---------- */
const SPEED = [[0, 1.5], [40, 2.5], [84, 5], [88.5, 90], [92, 12], [148, 10], [150.5, 70], [155, 14], [186, 20], [198, 6], [224, 4], [300, 12], [330, 18], [333, -35], [342, -6], [345.5, 140], [350, 18], [356, 30], [361, 260], [366, 22], [384, 30], [398, 240], [419, 260], [421, 30], [440, 140], [464.9, 520], [465, 0], [483, 0], [483.4, 60], [495, 6], [505, -45], [521, -8], [540, -3]];
const TRAVEL = (() => { const a = new Float32Array(DUR * 20 + 400); let acc = 0; for (let i = 0; i < a.length; i++) { a[i] = acc; acc += K(SPEED, i / 20) / 20; } return a; })();
const travelAt = t => { const f = clamp(t * 20, 0, TRAVEL.length - 2), i = f | 0; return lerp(TRAVEL[i], TRAVEL[i + 1], f - i); };

const STAR_A = [[0, 0], [5, .3], [40, .4], [90, .6], [150, .55], [224, .5], [300, .7], [362, .8], [398, .55], [420, .8], [464.9, 1], [465, 0], [483, 0], [483.3, 1], [540, .85]];
const NEB_A = [[0, 0], [95, 0], [125, .3], [150, .2], [200, .15], [230, .2], [300, .45], [332, .8], [360, .55], [370, .5], [398, .2], [421, .6], [464.9, .9], [465, 0], [483, 0], [483.2, 1], [495, .6], [510, .75], [540, .65]];
const GAL_A = [[0, 0], [305, 0], [325, .45], [360, .3], [364, 0], [483, 0], [483.3, 1.1], [492, .45], [508, .75], [540, .65]];
const LENS = [[0, 0], [300, 0], [335, 1], [356, .6], [362, 0], [421, .4], [464.9, 1.6], [465, 0]];
const INWARD = [[0, 0], [438, 0], [464.9, 1], [465, 0]];
const ROLL = [[0, 0], [420, 0], [432, .12], [448, .9], [464.9, 3.4], [465, 0]];
const PERSIST = [[0, 0], [86, 0], [88.6, .6], [91, 0], [355, 0], [361, .72], [365, 0], [398, 0], [400, .6], [419, .6], [421, 0], [432, 0], [450, .55], [464.9, .78], [465, 0], [483, 0], [483.1, .5], [486, 0]];
const LSCALE = [[0, 1], [330, 1], [338, .3], [344, .3], [347.5, 1.08], [351, 1], [355, 1], [361.5, 70], [362, 90], [412, .01], [420.5, 1], [465, 1], [495, 1], [510, .42], [521, .15], [529, .25], [540, .24]];
const LYOFF = [[0, 0], [505, 0], [521, -.08], [529, -.14], [540, -.14]];
const FORM = [[0, 0], [224, 0], [236, .03], [270, .15], [300, .33], [330, .5], [360, .68], [420, .8], [462, .955], [483, .955], [484.6, 1.04]];
const SWARM = [[0, 0], [224, .15], [290, .35], [300, .9], [360, 1], [420, .8], [464, 1], [465, 0]];
const LOGO_DIM = [[0, 1], [464.9, 1], [465, .18], [482.9, .14], [483, 1]];

}

function drawGalaxies(a) {

function drawStars(a) {
  if (a <= .005) return;
  const tr = travelAt(T), spd = K(SPEED), streak = Math.min(Math.abs(spd) * .09, 900), FOV = MIN * .9;

  ctx.lineCap = 'round';
  const lines = streak > 3;
  if (lines) { ctx.strokeStyle = 'rgb(225,232,255)'; ctx.lineWidth = 1; }
  for (let i = 0; i < NST; i += step) {
    const s = ST[i];
    let z = ((s.z - tr) % ZR + ZR) % ZR; if (z < 8) continue;
    const f = FOV / z; let x = s.x * f, y = s.y * f;
    let x2 = 0, y2 = 0;
    if (lines) { const z2 = z + streak * Math.sign(spd || 1); const f2 = FOV / Math.max(z2, 8); x2 = s.x * f2; y2 = s.y * f2; }
    if (inward > 0) { const r = Math.hypot(x, y) + 1, k = 1 - inward * .55, sw = inward * 1.6 / (1 + r / MIN);
      const c = Math.cos(sw), sn = Math.sin(sw); let nx = (x * c - y * sn) * k, ny = (x * sn + y * c) * k; x2 = x2 * (k + .2) ; y2 = y2 * (k + .2); x = nx; y = ny; }
    x += CX; y += CY; x2 += CX; y2 += CY;
    if (lens > 0) { const dx = x - lx, dy = y - ly, r = Math.hypot(dx, dy) + 1; const push = lens * lr * lr / (r + lr * .3) * .35; x += dx / r * push; y += dy / r * push; x2 += dx / r * push; y2 += dy / r * push; }

    const r = clamp(1.6 + 900 / z, 0, 14) * (0.6 + s.m);

}

function drawRoad() {
  const a = win(150, 152.5, 184, 191);
  if (a <= .005) return;
  const bend = sm(seg(164, 178)), hy = CY + H * .05 - bend * H * .1;
  const P = (side, d) => { const s = 1 / (1 + d); const x = CX + side * W * .55 * s + Math.sin(d * .4 + T * .1) * W * .04 * (1 - s); const y = hy + (H * 1.05 - hy) * s - bend * Math.pow(1 - s, 2.2) * H * .75; return [x, y]; };

    const lane = (hash(k) - .5) * 1.6; const [x0, y0] = P(-1, d), [x1] = P(1, d); const [cx0, cy0] = P(0, d);

}

function drawMorph() {
  const a = win(197.5, 199, 225, 229);

  const src = k === 0 ? null : SHAPES[k - 1];
  const sc = MIN * .42;
  const starCollapse = k === 0 ? 1 - .6 * sm(seg(198.5, 201.8)) : 1;
  const hold = seg(t0, SHAPE_T[k + 1]);

}

function drawShocks(x, y) {

  }
}

function drawLightning(a, lx, ly, lr) {

    ctx.beginPath();
    for (let k = 0; k <= len; k++) { const p = OUTER[(i0 + k) % OUTER.length]; const j = (hash(slot * 13 + k + b) - .5) * .06, out = 1.06 + hash(slot + k * 3) * .05;
      const x = lx + p[0] * lr * out + j * lr, y = ly + (p[1] - .05) * lr * out + .05 * lr + j * lr; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }

function logoVis() {
  // hidden while we're inside the particle / universe / eye / tunnel
  return 1 - win(361.8, 362.6, 413, 416.5);
}

function drawLogo() {
  if (T < 223) return;
  const vis = logoVis(); if (vis <= .003) return;
  const lr = logoR(), [lx, ly] = logoC();
  const F = K(FORM), sw = K(SWARM) * vis, dim = K(LOGO_DIM) * vis;
  const swirl = (T - 224) * .045;
  const step = QUALITY < .7 ? 2 : 1;
  const trail = [];
  const partR = Math.max(lr * .028, 1.2);
  const Wd = .07;
  for (let i = 0; i < LN; i += step) {
    const p = (F - LKEY[i]) / Wd;
    const tx = LP[i][0], ty = LP[i][1];
    if (p >= 1) {
      const tw = .75 + .25 * Math.sin(T * 2.3 + i);
      dot(SP.w, lx + tx * lr, ly + ty * lr, partR, .42 * tw * dim * (1 - .85 * sm(seg(483.2, 486))));
      continue;
    }
    if (p < -3.2 || sw <= .01) continue;
    const pos = (pp) => {
      const q = Math.min(1 - pp, 4.2), q2 = q * q;
      const an = q2 * LTH[i] + swirl * sm(-pp / 2);
      const sc = 1 + q2 * LSC[i];
      const c = Math.cos(an), s = Math.sin(an);
      return [lx + (tx * c - ty * s) * sc * lr, ly + (tx * s + ty * c) * sc * lr];
    };
    const [x, y] = pos(p);
    const al = sm((p + 3.2) / 2.2) * sw;
    dot(i % 11 ? SP.w : SP.g, x, y, partR * (p > 0 ? 1.1 : .75), al * (p > 0 ? .8 : .45));
    if (p > -1.6) trail.push(pos(p - .14), [x, y], al);
  }
  if (trail.length) {
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgb(210,225,255)'; ctx.globalAlpha = .3;
    ctx.beginPath(); for (let k = 0; k < trail.length; k += 3) { ctx.moveTo(trail[k][0], trail[k][1]); ctx.lineTo(trail[k + 1][0], trail[k + 1][1]); } ctx.stroke();
  }
  // ghost of the true symbol, emerging
  const ia = K(IMG_A) * vis;
  if (ia > .003 && LOGO_IMG.complete) {
    if (ia > .3) { // carve a pocket of darkness so the symbol reads razor-clean
      ctx.globalCompositeOperation = 'source-over';
      const g = ctx.createRadialGradient(lx, ly, lr * .5, lx, ly, lr * 1.35); g.addColorStop(0, 'rgba(0,0,0,.82)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = clamp((ia - .3) / .7); ctx.fillStyle = g; ctx.fillRect(lx - lr * 1.4, ly - lr * 1.4, lr * 2.8, lr * 2.8);
      ctx.globalCompositeOperation = 'lighter';
    }
    if (LOGO_GLOW) { ctx.globalAlpha = clamp(ia * .32); ctx.drawImage(LOGO_GLOW, lx - lr * 8 / 7, ly - lr * 8 / 7, lr * 16 / 7, lr * 16 / 7); }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = clamp(ia); ctx.drawImage(LOGO_IMG, lx - lr, ly - lr, lr * 2, lr * 2);
    ctx.globalCompositeOperation = 'lighter';
  }
  // the gold star — born from the spark
  const sa = sm(seg(482.95, 483.3)) * vis;
  if (sa > .003) {
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = sa; ctx.drawImage(STAR_IMG, lx - lr, ly - lr, lr * 2, lr * 2); ctx.globalCompositeOperation = 'lighter';
    const sx = lx + LOGO.starPos[0] * lr, sy = ly + LOGO.starPos[1] * lr;
    dot(SP.g, sx, sy, lr * .09 * (1 + .1 * Math.sin(T * 3)), sa * .55);
  }
  // activation wave through every line
  const wv = (T - 483) / 1.5;
  if (wv > -.05 && wv < 1.3) {
    for (let i = 0; i < LN; i += step) { const d = Math.abs(LP[i][2] - wv); if (d > .07) continue; const k = 1 - d / .07;
      dot(k > .6 ? SP.w : SP.g, lx + LP[i][0] * lr, ly + LP[i][1] * lr, partR * (2 + 3 * k), k); }
  }
  drawLightning(K(LIGHTNING) * vis, lx, ly, lr);
}

function drawSpark() {
  const a = win(479.5, 480.5, 483, 483.2);
  if (a <= .005) return;
  const lr = logoR(), [lx, ly] = logoC();
  const tx = lx + LOGO.starPos[0] * lr, ty = ly + LOGO.starPos[1] * lr;
  const p = ease3(seg(480, 483));
  const sx = lerp(CX + W * .32, tx, p), sy = lerp(-H * .1, ty, p) + Math.sin(p * Math.PI) * H * .08;
  for (let k = 1; k < 18; k++) { const pp = ease3(seg(480, 483) - k * .012); if (pp < 0) break; const x = lerp(CX + W * .32, tx, pp), y = lerp(-H * .1, ty, pp) + Math.sin(pp * Math.PI) * H * .08; dot(SP.g, x, y, 5 - k * .2, a * (1 - k / 18) * .6); }
  dot(SP.w, sx, sy, 7 + 4 * Math.sin(T * 30), a);
  dot(SP.g, sx, sy, 20, a * .6);
}

function drawBurst(lx, ly) {
  const dt = T - 483; if (dt < 0 || dt > 14) return;
  const fade = Math.exp(-dt * .32);
  const step = QUALITY < .7 ? 2 : 1;
  for (let i = 0; i < 1800; i += step) {
    const an = hash(i * 1.3) * TAU, v = .3 + Math.pow(hash(i * 2.7), 2) * 1.9;
    const r = v * (1 - Math.exp(-dt * 1.5)) * MIN * .9 + dt * 4;
    dot(i % 4 ? SP.w : i % 3 ? SP.g : SP.c, lx + Math.cos(an) * r, ly + Math.sin(an) * r * (i % 5 ? 1 : .4), 1.5 + hash(i) * 3, fade * (.4 + .6 * hash(i * 5)));
  }
  // constellations connecting across the sky
  const ca = win(483.4, 485, 492, 499);
  if (ca > .005) {
    ctx.lineWidth = .8; ctx.strokeStyle = 'rgb(255,228,185)';
    for (let c = 0; c < 9; c++) {
      const bx = CX + (hash(c * 3.1) - .5) * W * .95, by = CY + (hash(c * 5.3) - .5) * H * .9;
      if (Math.hypot(bx - lx, by - ly) < MIN * .38) continue;
      const pts = Array.from({ length: 6 }, (_, k) => [bx + (hash(c * 9 + k) - .5) * MIN * .28, by + (hash(c * 13 + k) - .5) * MIN * .2]);
      const prog = clamp((T - 483.4 - c * .25) / 1.4) * 5;
      ctx.globalAlpha = ca * .55; ctx.beginPath();
      for (let k = 0; k < 5 && k < prog; k++) { const f = clamp(prog - k); ctx.moveTo(pts[k][0], pts[k][1]); ctx.lineTo(lerp(pts[k][0], pts[k + 1][0], f), lerp(pts[k][1], pts[k + 1][1], f)); }
      ctx.stroke(); pts.forEach(p => dot(SP.w, p[0], p[1], 4, ca));
    }
  }
  // filaments across the background
  const fa = win(483.1, 483.6, 487, 495) * .6;
  if (fa > .005) { ctx.lineWidth = 1; for (let k = 0; k < 10; k++) { ctx.beginPath(); const y0 = H * hash(k * 7), y1 = H * hash(k * 11); ctx.moveTo(-10, y0); ctx.bezierCurveTo(W * .3, y0 + (hash(k) - .5) * H, W * .7, y1 - (hash(k * 2) - .5) * H, W + 10, y1); ctx.strokeStyle = k % 2 ? 'rgb(130,200,255)' : 'rgb(200,160,255)'; ctx.globalAlpha = fa * .5; ctx.stroke(); } }
}

function drawEye() {
  const a = win(383.5, 387.5, 397.5, 399);
  if (a <= .005) return;
  const es = MIN * .22 * Math.exp(Math.max(0, T - 386) * .3), pr = es * .3;
  ctx.save(); ctx.translate(CX, CY); ctx.rotate(T * .03);
  // iris filaments
  ctx.lineWidth = Math.max(1, es * .004);
  for (let k = 0; k < 260; k++) {
    const an = k / 260 * TAU + hash(k) * .02, l0 = pr * (1 + hash(k * 3) * .08), l1 = es * (.75 + hash(k * 7) * .3);
    const wig = Math.sin(an * 7 + T * .4) * .04;
    ctx.globalAlpha = a * (.25 + .4 * hash(k * 5)); ctx.strokeStyle = k % 3 ? 'rgb(110,200,230)' : 'rgb(240,195,120)';
    ctx.beginPath(); ctx.moveTo(Math.cos(an) * l0, Math.sin(an) * l0); ctx.quadraticCurveTo(Math.cos(an + wig) * (l0 + l1) / 2, Math.sin(an + wig) * (l0 + l1) / 2, Math.cos(an) * l1, Math.sin(an) * l1); ctx.stroke();
  }
  for (let k = 0; k < 5; k++) { ctx.globalAlpha = a * .25; ctx.strokeStyle = 'rgb(210,230,255)'; ctx.beginPath(); ctx.arc(0, 0, pr + (es - pr) * (k + 1) / 6, 0, TAU); ctx.stroke(); }
  dot(SP.c, 0, 0, es * 1.35, a * .25);
  ctx.restore();
  // pupil — the dark we fall through
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = a; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(CX, CY, pr, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgb(255,240,210)'; ctx.lineWidth = 1.5; ctx.globalAlpha = a * .8; ctx.beginPath(); ctx.arc(CX, CY, pr, 0, TAU); ctx.stroke();
  dot(SP.w, CX, CY, Math.max(3, pr * .05), a * .8);
}

const GLYPHS = [
  (c, s) => { c.moveTo(-s, -s); c.lineTo(s, -s); c.lineTo(-s, s); c.lineTo(s, s); c.closePath(); },               // hourglass: time
  (c, s) => { c.moveTo(-s, 0); c.lineTo(s, 0); c.moveTo(s * .4, -s * .5); c.lineTo(s, 0); c.lineTo(s * .4, s * .5); }, // arrow: direction
  (c, s) => { c.moveTo(0, s); c.lineTo(0, 0); c.lineTo(-s * .8, -s); c.moveTo(0, 0); c.lineTo(s * .8, -s); },          // fork: choice
  (c, s) => { c.arc(0, 0, s, .5, TAU - .5); },                                                                          // broken ring: ending → beginning
  (c, s) => { for (let k = 0; k < 40; k++) { const a = k * .3, r = s * k / 40; k ? c.lineTo(Math.cos(a) * r, Math.sin(a) * r) : c.moveTo(0, 0); } }, // spiral: continuation
  (c, s) => { c.moveTo(-s * .5, s); c.lineTo(-s * .5, -s * .6); c.arc(0, -s * .6, s * .5, Math.PI, 0); c.lineTo(s * .5, s); }, // doorway: beginning
  (c, s) => { for (let k = 1; k < 4; k++) { c.moveTo(s * k / 3 * Math.cos(-.8), s * k / 3 * Math.sin(-.8)); c.arc(0, 0, s * k / 3, -.8, .8); } }, // echo arcs: memory
  (c, s) => { for (let k = -3; k <= 3; k++) { c.moveTo(k * s / 3, 0); c.lineTo(k * s / 3 + s * .08, 0); } },           // distance
  (c, s) => { c.moveTo(-s, 0); for (let k = 0; k <= 20; k++) c.lineTo(-s + k / 10 * s, Math.sin(k * 1.3) * s * .3 * (hash(k) + .3)); } // uncertainty
];

function drawTunnel() {
  const a = win(397.5, 399.5, 419, 421);
  if (a <= .005) return;
  const tt = (T - 398) * 260 + Math.pow(seg(410, 420), 2) * 900;
  const FOV = MIN * .5, SP_ = 110, NR = 26;
  for (let k = 0; k < NR; k++) {
    const idx = Math.floor(tt / SP_) + NR - k;
    const z = idx * SP_ - tt; if (z < 20) continue;
    const R = FOV * 260 / z, fade = clamp(1 - z / (NR * SP_)) * clamp(z / 200);
    const rot = idx * .7 + T * .2 * (idx % 2 ? 1 : -1);
    const wob = Math.sin(idx * .9 + T) * R * .05;
    for (let p = 0; p < 30; p++) { const an = p / 30 * TAU + rot; dot(p % 6 ? SP.c : SP.g, CX + Math.cos(an) * R + wob, CY + Math.sin(an) * R, 1.5 + R * .012, a * fade * .8); }
    ctx.strokeStyle = idx % 3 ? 'rgb(150,200,255)' : 'rgb(255,215,160)'; ctx.lineWidth = Math.max(.6, R * .004);
    ctx.globalAlpha = a * fade * .35; ctx.beginPath(); ctx.arc(CX + wob, CY, R, rot, rot + TAU * (.3 + hash(idx) * .6)); ctx.stroke();
    // symbolic fragments
    for (let gk = 0; gk < 3; gk++) {
      const gi = Math.floor(hash(idx * 3 + gk) * GLYPHS.length), an = hash(idx * 7 + gk) * TAU + rot * .3, gr = R * (.55 + .35 * hash(idx + gk));
      ctx.save(); ctx.translate(CX + Math.cos(an) * gr, CY + Math.sin(an) * gr); ctx.rotate(an + Math.PI / 2);
      ctx.beginPath(); GLYPHS[gi](ctx, R * .07); ctx.lineWidth = Math.max(.7, R * .004); ctx.strokeStyle = 'rgb(245,238,225)'; ctx.globalAlpha = a * fade * .7; ctx.stroke(); ctx.restore();
    }
  }
  // the light at the end of the tunnel
  const e = sm(seg(404, 420.3));
  dot(SP.soft, CX, CY, MIN * (.1 + e * .7), a * (.15 + e * .45));
  dot(SP.w, CX, CY, MIN * (.02 + e * .1), a * (.5 + e * .5));
}

function drawCollapseArcs() {
  const a = win(426, 438, 464.9, 465);
  if (a <= .005) return;
  const p = seg(426, 465);
  for (let k = 0; k < 12; k++) {
    const r = MIN * (.55 + hash(k) * .9) * (1 - p * .35), st = hash(k * 3) * TAU + T * (.2 + p * 1.8) * (k % 2 ? 1 : -1), span = 1 + hash(k * 5) * 2.2;
    ctx.beginPath(); ctx.ellipse(CX, CY, r, r * (.6 + .4 * hash(k * 9)), hash(k * 11) * 3, st, st + span);
    ctx.strokeStyle = k % 3 ? 'rgb(190,215,255)' : 'rgb(255,210,150)';
    ctx.globalAlpha = a * .12; ctx.lineWidth = 16; ctx.stroke(); ctx.globalAlpha = a * .7; ctx.lineWidth = 1.4; ctx.stroke();
  }
  // pathways collapsing: lines from the edges falling toward center
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgb(230,235,255)';
  for (let k = 0; k < 40; k++) {
    const an = hash(k * 2.2) * TAU, ph = (T * (.25 + hash(k) * .4) + hash(k * 4)) % 1, r0 = MIN * 1.2 * (1 - ph), r1 = r0 * (.6 + .3 * hash(k));
    ctx.globalAlpha = a * .5 * Math.sin(ph * Math.PI); ctx.beginPath(); ctx.moveTo(CX + Math.cos(an) * r0, CY + Math.sin(an) * r0); ctx.lineTo(CX + Math.cos(an + .1) * r1, CY + Math.sin(an + .1) * r1); ctx.stroke();
  }
}

function drawSilenceMotes() {
  const a = win(465, 466.5, 482.5, 483.2);
  if (a <= .005) return;
  for (let i = 0; i < 26; i++) {
    const x = CX + (hash(i * 3.7) - .5) * W * .9 + Math.sin(T * .15 + i) * 30, y = CY + (hash(i * 8.1) - .5) * H * .8 + Math.cos(T * .12 + i * 2) * 24 - (T - 465) * 3;
    dot(SP.w, x, y, 2.5 + hash(i) * 3, a * (.25 + .3 * Math.sin(T * .8 + i)));
  }
}

function drawFinalPath() {
  if (T < 495) return;
  const lr = logoR(), [lx, ly] = logoC();
  const u = lr; // path is built in logo units so it scales with the camera
  const fwd = t => [lx + (t * 2.6 + Math.sin(t * 1.3) * .8) * u, ly + (-t * 1.5 - Math.sin(t * .9) * .9) * u];
  const back = t => [lx + (-t * 2.4 - Math.sin(t * 1.1) * .6) * u, ly + (t * 1.6 + Math.sin(t * .8) * .5) * u];
  const branch = t => [lx + (t * .4 + Math.sin(t * 1.6) * .5) * u, ly + (-t * 2.6) * u];
  const lines = [[fwd, 496, 2 + Math.pow(seg(496, 540), 1.2) * 40, 'rgb(255,236,200)'], [back, 499, 1.5 + seg(499, 525) * 14, 'rgb(190,215,255)'], [branch, 502, 1 + seg(502, 530) * 12, 'rgb(215,200,255)']];
  for (const [fn, t0, reachMax, col] of lines) {
    const a = sm(seg(t0, t0 + 1.2)); if (a <= 0) continue;
    const reach = reachMax * sm(seg(t0, t0 + 10) + .02);
    ctx.beginPath(); let first = true;
    for (let t = .9; t <= reach; t += .03 + t * .01) { const [x, y] = fn(t); first ? ctx.moveTo(x, y) : ctx.lineTo(x, y); first = false; }
    ctx.strokeStyle = col; ctx.globalAlpha = a * .08; ctx.lineWidth = 10; ctx.stroke(); ctx.globalAlpha = a * .8; ctx.lineWidth = 1.2; ctx.stroke();
    // head of the line, still travelling
    const [hx, hy] = fn(reach); dot(SP.w, hx, hy, 6, a * .9); dot(SP.g, hx, hy, 16, a * .4);
    // pulses along it
    for (let k = 0; k < 6; k++) { const t = .9 + ((T * .6 + k / 6 * reach) % (reach - .9 + .001)); const [x, y] = fn(t); dot(SP.w, x, y, 3, a * .7 * Math.exp(-t * .08)); }
  }
  // echoes: earlier destinations left behind along the road we came from
  const ea = sm(seg(506, 514)) * (LOGO_IMG.complete ? 1 : 0);
  if (ea > .005) for (let k = 1; k <= 4; k++) { const [x, y] = back(k * 2.3); const s = lr * (.55 - k * .08); ctx.globalAlpha = ea * (.24 / k); ctx.drawImage(LOGO_IMG, x - s, y - s, s * 2, s * 2); }
  // celestial landscape: bands of nebula along the far path
  const la = sm(seg(508, 520));
  if (la > .005) for (let k = 0; k < 3; k++) { const [x, y] = fwd(6 + k * 5); const s = MIN * (1.4 - k * .3); ctx.save(); ctx.translate(x, y); ctx.rotate(-.5 + k * .2); ctx.scale(1, .3); ctx.globalAlpha = la * .5; ctx.drawImage(NEB[k], -s / 2, -s / 2, s, s); ctx.restore(); }
}

/* title: "ENDLESS DESTINY" formed from fragments of light */
let TITLE = null;
function buildTitle() {
  const text = 'ENDLESS DESTINY';
  const fs = Math.round(Math.min(W * .052, 68, H * .085)), sp = fs * .42;
  const c = mk(Math.ceil(W), Math.ceil(fs * 2)), x = c.getContext('2d');
  x.font = `200 ${fs}px Jost, 'Helvetica Neue', sans-serif`; x.textBaseline = 'middle'; x.fillStyle = '#fff';
  const widths = [...text].map(ch => x.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + sp * (text.length - 1);
  let px = (W - total) / 2; const letters = [];
  [...text].forEach((ch, i) => { letters.push({ ch, x: px, w: widths[i] }); x.fillText(ch, px, fs); px += widths[i] + sp; });
  const d = x.getImageData(0, 0, c.width, c.height).data, pts = [];
  const stepPx = Math.max(1, Math.round(fs / 34));
  for (let yy = 0; yy < c.height; yy += stepPx) for (let xx = 0; xx < c.width; xx += stepPx) if (d[(yy * c.width + xx) * 4 + 3] > 120) {
    let li = 0; for (let k = 0; k < letters.length; k++) if (xx >= letters[k].x - 1) li = k; pts.push([xx, yy - fs, li]); }
  TITLE = { c, fs, pts, letters, n: text.length };
}
function drawTitle() {
  if (T < 523 || !TITLE) return;
  const lr = logoR(), [, ly] = logoC();
  const ty = Math.min(ly + lr * 1.28 + TITLE.fs * .9, H - TITLE.fs * 2.6);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < TITLE.pts.length; i += 1) {
    const [x, y, li] = TITLE.pts[i]; const st = 524 + li * .38 + hash(i) * .6;
    const p = ease3((T - st) / 2.2); if (p <= 0) continue;
    const ox = x + (hash(i * 3) - .5) * W * .7, oy = ty + y + (hash(i * 7) - .5) * H * .6 - H * .1;
    const px = lerp(ox, x, p), py = lerp(oy, ty + y, p);
    const fadeOut = 1 - sm((T - st - 2.4) / 1.4);
    dot(hash(i) > .85 ? SP.g : SP.w, px, py, 2.2, (.25 + .75 * p) * (.3 + .7 * fadeOut) * .8);
  }
  // crisp letters resolve out of the light
  ctx.save(); ctx.font = `200 ${TITLE.fs}px Jost, 'Helvetica Neue', sans-serif`; ctx.textBaseline = 'middle'; ctx.fillStyle = '#f6f0e4';
  ctx.globalCompositeOperation = 'source-over';
  TITLE.letters.forEach((L, i) => { const a = sm((T - (524 + i * .38 + 1.8)) / 1.6); if (a <= 0) return; ctx.globalAlpha = a; ctx.fillText(L.ch, L.x, ty); });
  ctx.restore();
  // presented by — the studio wordmark
  const wa = sm(seg(533, 536.5));
  if (wa > 0 && WORD_IMG.complete) { const ww = Math.min(W * .3, 300), wh = ww / LOGO.wordAspect; ctx.globalAlpha = wa * .7; ctx.drawImage(WORD_IMG, CX - ww / 2, Math.min(ty + TITLE.fs * 1.5, H - wh - 24), ww, wh); }
}

function drawSubtitle() {
  if (!OPT.subs) return;
  const n = NARR.find(n => T >= n.t && T < n.t + n.dur); if (!n) return;
  const a = sm((T - n.t) / .6) * (1 - sm((T - (n.t + n.dur - .8)) / .8));
  const fs = Math.round(clamp(MIN * .028, 13, 22));
  ctx.save(); ctx.globalCompositeOperation = 'source-over';
  ctx.font = `300 ${fs}px Jost, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${fs * .12}px`;
  const maxW = Math.min(W - 32, 760), words = n.s.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  lines.push(cur);
  const y0 = H - 54 - (lines.length - 1) * fs * 1.5 - (T > 523 ? 0 : 0);
  ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 12;
  ctx.fillStyle = 'rgba(244,239,230,1)'; ctx.globalAlpha = a * .92;
  lines.forEach((l, i) => ctx.fillText(l, CX, y0 + i * fs * 1.5));
  ctx.restore();
}

let lastFrame = performance.now(), frameAvg = 16;
function render() {
  const P = K(PERSIST);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  if (P > .01) {
    // feedback: zoom the previous frame toward the camera (folding space / tunnel smear)
    ctx.globalAlpha = P * .55; const z = 1.012 + P * .02;
    const w = cv.width, h = cv.height;
    ctx.drawImage(cv, (w - w * z) / 2, (h - h * z) / 2, w * z, h * z);

  drawGalaxies(K(GAL_A));

  drawBurst(lx, ly);
  drawSpark();
  drawSilenceMotes();
  ctx.restore();

  let fl = 0; for (const [ft, amt, dec] of FLASHES) { const d = T - ft; if (d >= 0 && d < dec * 3) fl += amt * Math.exp(-d / dec * 2.2) * clamp(d / .04); }

  drawTitle();

  // grade: vignette, grain, fade to black at the edges of the film
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1; ctx.drawImage(VIGNETTE, -W * .1, -H * .1, W * 1.2, H * 1.2);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .028;
  const gx = -Math.random() * 256, gy = -Math.random() * 256;
  for (let x = gx; x < W; x += 256) for (let y = gy; y < H; y += 256) ctx.drawImage(GRAIN, x, y);

  const endFade = sm(seg(538.5, 540.5)) * .0; if (endFade > 0) { ctx.globalAlpha = endFade; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }

  ctx.globalAlpha = 1;
}

let ci = 0;
function scheduleCues() {
  if (!AC || state !== 'playing') return;
  while (ci < CUES.length && CUES[ci].t <= T + .3) {
    const c = CUES[ci++]; if (c.t < T - .25) continue;
    try { c.fn(Math.max(AC.currentTime + .01, t0 + c.t)); } catch (e) { console.warn(e); }
  }
}

/* ---- narration via speech synthesis ---- */
let VOICE = null;
function pickVoice() {
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const en = vs.filter(v => /^en/i.test(v.lang));
  const pref = [/Daniel/i, /Google UK English Male/i, /Arthur/i, /Guy/i, /Ryan/i, /Christopher/i, /Male/i, /Alex/i, /Fred/i, /Thomas/i];
  for (const r of pref) { const v = en.find(v => r.test(v.name)); if (v) return (VOICE = v); }
  VOICE = en[0] || vs[0] || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function narrate() {
  for (const n of NARR) {
    if (!n.done && T >= n.t) {
      n.done = true;
      if (OPT.narr && window.speechSynthesis && T < n.t + 1.5) {
        const u = new SpeechSynthesisUtterance(n.s.replace(/…/g, '...'));
        if (VOICE) u.voice = VOICE; u.rate = .8; u.pitch = .55; u.volume = 1;
        speechSynthesis.speak(u);
      }
    }

}

/* =====================================================================
   TRANSPORT

const OPT = { narr: true, subs: true };
let state = 'idle', t0 = 0, pausedAt = 0;
const Q = new URLSearchParams(location.search);
function seek(t) {
  t = clamp(t, 0, DUR);
  if (window.speechSynthesis) speechSynthesis.cancel();
  NARR.forEach(n => n.done = n.t < t - .01);
  ci = 0; while (ci < CUES.length && CUES[ci].t < t) ci++;
  if (AC) { newBus(); t0 = AC.currentTime - t; }
  pausedAt = t; T = t;
  if (songEl) { songEl.currentTime = t; }
}
function play() {
  if (!AC) return;
  AC.resume(); t0 = AC.currentTime - pausedAt; state = 'playing';
  if (window.speechSynthesis) speechSynthesis.resume();
  if (songEl) { songEl.currentTime = pausedAt; songEl.play(); }
  bPlay.textContent = 'Pause';
}
function pause() {
  if (state !== 'playing') return;
  pausedAt = T; state = 'paused';
  if (window.speechSynthesis) speechSynthesis.pause();
  if (songEl) songEl.pause();
  updateBeds();
  setTimeout(() => { if (state === 'paused') AC.suspend(); }, 250);
  bPlay.textContent = 'Play';
}

const gate = document.getElementById('gate'), bPlay = document.getElementById('bPlay'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), chapEl = document.getElementById('chap');
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

  seek(Number(Q.get('t')) || 0); play();
};
bPlay.onclick = () => state === 'playing' ? pause() : (T >= DUR ? (seek(0), play()) : play());
scrub.oninput = () => { const was = state; seek(Number(scrub.value)); if (was === 'playing') t0 = AC.currentTime - T; };

  const f = e.target.files[0]; if (!f || !AC) return;

  songEl.src = URL.createObjectURL(f); musicLevel = .25; if (evMus) { evMus.gain.value = musicLevel; evMusRev.gain.value = musicLevel; }
  songEl.currentTime = T; if (state === 'playing') songEl.play();
};
let rec = null;
document.getElementById('bRec').onclick = () => {
  if (!AC) return;
  if (rec) { rec.stop(); return; }
  const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 }); const chunks = [];

  rec.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = 'endless-destiny.webm'; a.click(); rec = null; document.getElementById('bRec').textContent = 'Export .webm'; };
  seek(0); play(); rec.start(1000); document.getElementById('bRec').textContent = 'Stop export';
};
addEventListener('keydown', e => {

  if (e.key === 'f') document.getElementById('bFull').click();
  if (/^[0-9]$/.test(e.key)) { const c = CHAPTERS[Number(e.key)]; if (c) { seek(c[0]); if (state === 'playing') t0 = AC.currentTime - T; } }
});
let uiTimer = 0;
addEventListener('mousemove', () => { document.body.classList.add('ui'); clearTimeout(uiTimer); uiTimer = setTimeout(() => document.body.classList.remove('ui'), 2200); });

addEventListener('resize', resize);

function frame(now) {
  requestAnimationFrame(frame);
  const dt = now - lastFrame; lastFrame = now; frameAvg = frameAvg * .95 + dt * .05;
  if (frameAvg > 30 && QUALITY > .6) { QUALITY = .5; resize(); }

    if (rec && T >= DUR + 3) rec.stop();

  updateBeds();
  const Tr = Math.min(T, DUR);

  scrub.value = Tr; timeEl.textContent = `${fmt(Tr)} / ${fmt(DUR)}`;
