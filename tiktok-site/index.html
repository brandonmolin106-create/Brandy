<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brandon Molina</title>
  <meta name="description" content="Every video from @brandonmolina651, sorted by category, with likes and comments.">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="assets/profile.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="top" id="top">
    <div class="wrap top-row">
      <a class="top-brand" href="#top">
        <img class="top-avatar" src="assets/profile.jpg" alt="" width="32" height="32">
        <span id="top-name"></span>
      </a>
      <nav class="top-tabs" id="top-tabs" aria-label="Categories"></nav>
      <a class="btn btn-accent" id="follow-top" href="#" target="_blank" rel="noopener">Follow on TikTok</a>
    </div>
  </header>

  <main>
    <section class="profile wrap" id="profile">
      <img class="profile-avatar" src="assets/profile.jpg" alt="Brandon Molina" width="128" height="128">
      <div class="profile-body">
        <h1 id="hero-name"></h1>
        <a class="handle" id="hero-handle" href="#" target="_blank" rel="noopener"></a>
        <p class="bio" id="hero-bio"></p>
        <ul class="stats" id="stats">
          <li><b data-count="followers">0</b> followers</li>
          <li><b data-count="likes">0</b> likes</li>
          <li><b data-count="videos">0</b> videos</li>
          <li><b data-count="views">0</b> views</li>
        </ul>
        <div class="profile-actions">
          <a class="btn btn-accent" id="follow-hero" href="#" target="_blank" rel="noopener">Follow on TikTok</a>
          <button class="btn" id="shuffle-btn" type="button">Random video</button>
          <span class="where" id="hero-location"></span>
        </div>
      </div>
    </section>

    <section class="wrap" id="videos">
      <div class="toolbar" id="toolbar">
        <div class="tabs" id="chips" role="tablist" aria-label="Filter by category"></div>
        <div class="toolbar-right">
          <label class="search">
            <span class="sr">Search</span>
            <input id="search" type="search" placeholder="Search" autocomplete="off">
          </label>
          <label class="sort"><span class="sr">Sort</span>
            <select id="sort">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="views">Most viewed</option>
              <option value="liked">Most liked here</option>
              <option value="commented">Most commented</option>
              <option value="longest">Longest</option>
            </select>
          </label>
        </div>
      </div>
      <p class="count" id="result-count"></p>
      <div id="sections"></div>
      <div class="empty" id="empty" hidden>
        <p>Nothing matches that search.</p>
        <button class="btn" id="clear-filters" type="button">Clear</button>
      </div>
    </section>
  </main>

  <footer class="foot wrap">
    <span><span id="footer-name"></span>, <span id="year"></span>. Videos are the original uploads.</span>
    <a href="#top">Back to top</a>
  </footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close aria-label="Close" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
      </button>
      <div class="player" id="modal-player">
        <video id="player" playsinline preload="metadata"></video>
        <img id="modal-photo" class="player-photo" alt="" hidden>
        <button class="player-cover" id="p-cover" type="button" aria-label="Play or pause"></button>
        <div class="player-ui">
          <button class="pbtn" id="p-play" type="button" aria-label="Play or pause"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path id="p-play-icon" fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
          <div class="p-bar" id="p-bar"><div class="p-buf" id="p-buf"></div><div class="p-fill" id="p-fill"></div></div>
          <span class="p-time" id="p-time">0:00</span>
          <button class="pbtn" id="p-mute" type="button" aria-label="Mute"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path id="p-mute-icon" fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
          <button class="pbtn" id="p-full" type="button" aria-label="Fullscreen"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <span class="tag" id="modal-cat"></span>
          <h2 id="modal-title"></h2>
          <p class="panel-meta" id="modal-stats"></p>
          <p class="panel-music" id="modal-music"></p>
        </div>
        <div class="panel-actions">
          <button class="btn like-btn" id="like-btn" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path id="like-icon" fill="none" stroke="currentColor" stroke-width="2" d="M12 20.3 4.6 13a4.4 4.4 0 0 1 6.2-6.2l1.2 1.2 1.2-1.2a4.4 4.4 0 0 1 6.2 6.2z"/></svg>
            <span id="like-count">0</span>
          </button>
          <button class="btn" id="modal-prev" type="button">Previous</button>
          <button class="btn" id="modal-next" type="button">Next</button>
          <a class="btn" id="modal-open" href="#" target="_blank" rel="noopener">On TikTok</a>
          <button class="btn" id="modal-share" type="button">Copy link</button>
        </div>
        <section class="comments" aria-labelledby="comments-h">
          <h3 id="comments-h">Comments <span id="comment-count">0</span></h3>
          <ol class="comment-list" id="comment-list"></ol>
          <p class="comment-note" id="comment-note" hidden></p>
          <form class="composer" id="composer">
            <img class="composer-avatar" id="composer-avatar" alt="" width="32" height="32">
            <textarea id="comment-text" rows="1" maxlength="500" placeholder="Add a comment" required></textarea>
            <button class="btn btn-accent" id="comment-post" type="submit">Post</button>
          </form>
        </section>
        <label class="autoplay"><input type="checkbox" id="autonext" checked> Play next automatically</label>
      </div>
    </div>
  </div>

  <script src="videos.js"></script>
  <script src="app.js"></script>
</body>
</html>
